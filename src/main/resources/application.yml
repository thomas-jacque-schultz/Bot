spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: mongodb
  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DB}?authSource=admin
discord:
  token: ${DISCORD_TOKEN}
  admin:
    id: ${DISCORD_ADMIN_ID}
    username: ${DISCORD_ADMIN_USERNAME}
portainer:
  base-url: ${PORTAINER_VIRTUAL_HOST}
  token: ${PORTAINER_TOKEN}

auth:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:change-me}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-jwt-secret-key-with-at-least-32-characters}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:18090,http://localhost:5173}
